# dsh-disable-pwsh 的 bundle patch。
#
# 两层禁用，覆盖两种工具行所在平面：
#
# 1) 宿主平面：base（以及 headless / acp / sdk 等直接组合工具行的 profile）把
#    `tool-pwsh` 作为顶层行插入，本层直接把它关掉 —— win32 上连工具注册都不会
#    发生，工具插件附带的提示词小节也不会出现。
# 2) 预设平面：web profile 里工具行挂在 Agent 预设里（`config.plugins` 数组），
#    顶层 patch 够不到，由 index.js 的 Host 插件在 agent 创建时用
#    `tools.restrict({ deny: ['pwsh'] })` 移除。web-app 已经把宿主平面的
#    `tool-pwsh` 行禁用，下面这行在那里是幂等的。
#
# 注：`@deepseek-ai/dsh-tool-pwsh-persistent` 那条行（id 是 `persistent-pwsh`）
# 只出现在独立的 `dsh-sdk-minimal` bundle 和 web 的 `minimal` 预设里。顶层 patch
# 够不到预设里的行，而 `dsh-sdk-minimal` 不是一个常规 profile，所以这里不写
# `persistent-pwsh`：写了只会在其它 profile 里留下一条 "entry not found" 警告。
# 那个 bundle 上仍然由运行时那半边兜底 —— `pwsh` 一样从工具目录里消失，只是工具
# 自带的提示词小节还可能留在系统提示里。
- id: tool-pwsh
  disabled: true

# 本插件自己的 Host 插件行（运行时那半边）。
# id 只是 patch 的寻址键；loader 对重复 id 不查重，后一行会静默覆盖前一行，
# 所以这里用与包名一致的 id，撞名概率最低。
- insert:
    - id: dsh-disable-pwsh
      name: dsh-disable-pwsh
